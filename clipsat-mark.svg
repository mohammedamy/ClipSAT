<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1e27"/>
      <stop offset="1" stop-color="#0e1015"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="30" y1="165" x2="170" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E3A6E"/>
      <stop offset="0.45" stop-color="#2B5BA8"/>
      <stop offset="0.75" stop-color="#2F9E8F"/>
      <stop offset="1" stop-color="#5FD4C0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="30" y1="165" x2="170" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16294f"/>
      <stop offset="0.45" stop-color="#204a8c"/>
      <stop offset="0.75" stop-color="#25836f"/>
      <stop offset="1" stop-color="#46b3a0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="34" fill="url(#bg)"/>

  <!-- paperclip / S-link mark: two nested hook strokes -->
  <path d="M 46 138 C 46 110, 68 96, 92 96 C 116 96, 138 82, 138 54"
        fill="none" stroke="url(#ribbon2)" stroke-width="30" stroke-linecap="round"/>
  <path d="M 62 154 C 62 122, 88 106, 108 106 C 128 106, 154 90, 154 62"
        fill="none" stroke="url(#ribbon)" stroke-width="17" stroke-linecap="round"/>

  <!-- rivet accents -->
  <circle cx="70" cy="122" r="4.2" fill="#C9CFD8"/>
  <circle cx="96" cy="104" r="4.2" fill="#C9CFD8"/>
  <circle cx="124" cy="98" r="4.2" fill="#C9CFD8"/>
  <circle cx="146" cy="76" r="4.2" fill="#C9CFD8"/>

  <!-- sigma accents, echoing the original mark -->
  <text x="150" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#B6BCC6" text-anchor="middle">&#931;</text>
  <text x="50" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#B6BCC6" text-anchor="middle">&#931;</text>
</svg>
