
[functions.ai-proxy]
enabled = true
# Uses @supabase/server withSupabase({ auth: "user" }) to validate asymmetric ES256/JWKS
# user session tokens inside index.ts (legacy Kong gateway verify_jwt only supports HS256).
verify_jwt = false
import_map = "./functions/ai-proxy/deno.json"
entrypoint = "./functions/ai-proxy/index.ts"

[functions.google-token]
enabled = true
# Validated via @supabase/server withSupabase({ auth: "user" }) inside index.ts.
verify_jwt = false
import_map = "./functions/google-token/deno.json"
entrypoint = "./functions/google-token/index.ts"

[functions.tts-proxy]
enabled = true
# Validated via @supabase/server withSupabase({ auth: "user" }) inside index.ts.
verify_jwt = false
import_map = "./functions/tts-proxy/deno.json"
entrypoint = "./functions/tts-proxy/index.ts"

[functions.billing-webhook]
enabled = true
# Stripe and Moyasar send server-to-server webhooks signed via HMAC-SHA256
# (`Stripe-Signature` and `X-Moyasar-Signature`), not a Supabase JWT.
# Browser-initiated checkout/portal requests verify user JWT inside index.ts.
verify_jwt = false
import_map = "./functions/billing-webhook/deno.json"
entrypoint = "./functions/billing-webhook/index.ts"
