
[functions.ai-proxy]
enabled = true
# Rejects any request that isn't carrying a validly-signed Supabase JWT
# before it ever reaches index.ts — cheap first line of defense. This does
# NOT by itself require a signed-in user (the public anon key is itself a
# valid signed JWT for this project) — index.ts additionally calls
# auth.getUser() on the token to confirm it's a real logged-in session,
# which is the actual "must be signed in" gate.
verify_jwt = true
import_map = "./functions/ai-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-proxy/*.html" ]
