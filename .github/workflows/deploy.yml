name: Build & Deploy ClipSAT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Revise & fix flagged errors and auto-clear resolved flags
        run: |
          node scripts/revise-and-fix-flagged-errors.js
          if ! git diff --quiet content/ bank-data/ error-flags.json public/data/resolved-flags.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/ bank-data/ error-flags.json public/data/resolved-flags.json
            git commit -m "chore(auto-fix): revise flagged errors and clear resolved flags [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Extract content & build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
