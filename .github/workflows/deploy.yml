name: Build & Deploy ClipSAT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Blocking content, schema v2, strict KaTeX & figure gates
        run: |
          node scripts/validate-content.js
          node scripts/validate-ix.js
          node scripts/validate-banks.js
          node scripts/validate-katex-strict.js
          node scripts/validate-figures.js

      - name: Extract content & build static site
        run: npm run build

      - name: Run unit & security verification
        run: npm run test:unit

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
