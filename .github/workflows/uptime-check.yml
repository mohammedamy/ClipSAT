name: Uptime & Health Check

# Plan 5, Phase 5.010 — the "uptime" half of "basic uptime/error monitoring"
# (public/js/error-logging.js is the "error logging" half — see the ClipSAT
# roadmap artifact's Pillar 5 status panel). Pings the live site and the
# Supabase project on a schedule using only free GitHub-native tooling (no
# new third-party account to sign up for, matching the house rule against
# adding cost beyond free hosting): on failure it opens or updates ONE
# tracking issue rather than spamming a new one per run, and auto-closes it
# the next time everything's healthy again.
#
# Deliberately a separate workflow from deploy.yml/pr-checks.yml: it runs on
# a schedule against the LIVE site, not on push/PR against a build artifact,
# so mixing it into either of those would change what event triggers them.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check live site
        id: site
        run: |
          set +e
          ok=true
          detail=""
          for path in "/" "/calculus/" "/sat/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://clipsat.org${path}")
            echo "clipsat.org${path} -> ${code}"
            if [ "$code" != "200" ]; then
              ok=false
              detail="clipsat.org${path} returned HTTP ${code}"
              break
            fi
          done
          echo "ok=${ok}" >> "$GITHUB_OUTPUT"
          echo "detail=${detail}" >> "$GITHUB_OUTPUT"

      - name: Check Supabase project
        id: supabase
        run: |
          set +e
          url=$(grep -oP "url:\s*'\K[^']+" public/js/cloud-config.js)
          key=$(grep -oP "anonKey:\s*'\K[^']+" public/js/cloud-config.js)
          if [ -z "$url" ] || [[ "$url" == *"YOUR-PROJECT"* ]]; then
            echo "cloud sync not configured — nothing to check"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "detail=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -H "apikey: ${key}" "${url}/rest/v1/")
          echo "Supabase REST root -> ${code}"
          if [ "$code" != "200" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "detail=Supabase REST endpoint (${url}) returned HTTP ${code}" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "detail=" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update tracking issue on failure
        if: steps.site.outputs.ok == 'false' || steps.supabase.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const details = [
              '${{ steps.site.outputs.detail }}',
              '${{ steps.supabase.outputs.detail }}',
            ].filter(Boolean);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Automated health check failed:',
              '',
              ...details.map((d) => `- ${d}`),
              '',
              `Run: ${runUrl}`,
              `Checked: ${new Date().toISOString()}`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'ClipSAT health check failing',
                body,
                labels: ['uptime'],
              });
            }

      - name: Close tracking issue once healthy again
        if: steps.site.outputs.ok == 'true' && steps.supabase.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Healthy again as of ${new Date().toISOString()} — closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
