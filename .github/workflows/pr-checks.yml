name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  build-and-review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python 3.12 (SymPy & Psychometric Gates)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install SymPy
        run: pip install sympy

      - name: Setup Deno 2.x (Edge Function Test Gate)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Blocking content, schema v2, strict KaTeX & figure gates
        run: |
          node scripts/validate-content.js
          node scripts/validate-ix.js
          node scripts/validate-banks.js
          node scripts/validate-katex-strict.js
          node scripts/validate-figures.js
          node scripts/ci/validate-schema-v2.mjs
          python3 scripts/ci/verify_bank_sympy.py --all
          python3 scripts/ci/check_psychometrics.py
          node scripts/ci/check-katex-strict.mjs
          python3 scripts/ci/check_bilingual_parity.py
          node scripts/ci/validate-figures-and-pdfs.mjs
          node scripts/ci/check-no-eval-or-secrets.mjs
          node scripts/ci/check-rls-policies.mjs
          node scripts/ci/run-edge-tests.mjs

      - name: Build & validate content
        run: npm run build

      - name: CWV & build size budget gate
        run: |
          node scripts/ci/check-build-budgets.mjs
          node scripts/health-check.js --local

      - name: Unit, psychometric & security verification suites
        run: npm run test:unit

      - name: Second-reviewer gate for content changes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-second-reviewer.js

  e2e-and-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Playwright (E2E, RTL, Offline & WCAG 2.2 AA Accessibility)
        run: npm run test:e2e
