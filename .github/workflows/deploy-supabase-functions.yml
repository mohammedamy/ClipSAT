name: Deploy Supabase Edge Functions

# The Edge Functions under supabase/functions/ (ai-proxy, google-token) used to be deployed only by
# hand with `supabase functions deploy`, so a merged change (e.g. #246, the ai-proxy model switch)
# didn't reach the live site until someone remembered to run it. This deploys each function whose
# files changed on a push to main, or every function when run by hand from the Actions tab.
#
# Needs one repository secret, SUPABASE_ACCESS_TOKEN (a personal access token from
# supabase.com/dashboard/account/tokens). Without it the job skips with a warning instead of
# failing, so merges are never blocked on it. Function secrets such as AI_API_KEY live in Supabase
# itself and are untouched by a deploy.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ynnqrxeprxhtdimzwxwx

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which functions to deploy
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          all=$(ls -d supabase/functions/*/ | xargs -n1 basename | tr '\n' ' ')
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || git diff --name-only "$BEFORE" "$AFTER" | grep -q '^supabase/config.toml$'; then
            fns="$all"
          else
            fns=$(git diff --name-only "$BEFORE" "$AFTER" | sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')
          fi
          echo "Functions to deploy: ${fns:-none}"
          echo "functions=$fns" >> "$GITHUB_OUTPUT"

      - name: Install the Supabase CLI
        if: steps.pick.outputs.functions != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        if: steps.pick.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTIONS: ${{ steps.pick.outputs.functions }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set, so nothing was deployed. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 0
          fi
          for fn in $FUNCTIONS; do
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            echo "::endgroup::"
          done
